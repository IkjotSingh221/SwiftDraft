[project]
name = "draftforge"
version = "0.1.0"
description = "Agentic RAG document drafter for STEM students"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=1.0",
  "qdrant-client>=1.9",
  "fastembed>=0.3",
  "sentence-transformers>=3.0",
  "anthropic>=0.34",
  "google-genai>=0.3",
  "python-multipart>=0.0.9",
  "jsonschema>=4.22",
  "lxml>=5.2",
  "docling>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
